name: Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  canary:
    runs-on: ubuntu-latest
    if: github.actor == 'juanpicado'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Declare some variables
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Bump up package
        run: npm version prerelease --no-git-tag-version --preid ${{ env.sha_short }}
      - name: Publish
        run: bash scripts/publish-prerelease.sh
        env:
          REGISTRY_AUTH_TOKEN: ${{ secrets.PUBLISH_CANARY_VERDACCIO_TOKEN }}
          REGISTRY_URL: rg.verdaccio.org
